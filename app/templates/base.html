<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Doações Comunitárias{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo principal</a>
  <header class="topo">
    <h1 class="marca">Doações Comunitárias</h1>
    <nav aria-label="Principal">
      <ul>
        <li><a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Doações</a></li>
        <li><a href="/painel" {% if request.path == '/painel' %}aria-current="page"{% endif %}>Painel</a></li>
        <li><a href="/feedback" {% if request.path == '/feedback' %}aria-current="page"{% endif %}>Avaliar o sistema</a></li>
      </ul>
    </nav>
    <div class="ferramentas" role="group" aria-label="Ferramentas de acessibilidade">
      <button type="button" class="secundario" id="aa-menos" aria-label="Diminuir tamanho do texto">A−</button>
      <button type="button" class="secundario" id="aa-mais" aria-label="Aumentar tamanho do texto">A+</button>
      <button type="button" class="secundario" id="aa-contraste" aria-pressed="false">Alto contraste</button>
    </div>
  </header>
  <main id="conteudo" tabindex="-1">
    {% block conteudo %}{% endblock %}
  </main>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <footer class="rodape">
    <p>Projeto Integrador Univesp &middot; versão {{ config['VERSAO'] }}</p>
  </footer>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/acessibilidade.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
