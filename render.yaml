# Deploy na nuvem (Render.com) com banco PostgreSQL no Neon.
services:
  - type: web
    name: doacoes-comunitarias
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /api/saude   # não consulta o banco, para o Neon poder suspender
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false               # cole a connection string do Neon no painel do Render
      - key: AGENTE_CODIGO
        sync: false               # código dos agentes de endemias (não coloque no GitHub)
